name: Deploy site to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore presentation photos
        run: |
          cat \
            .github/photo-atlas-fixed/part-00a.b64 \
            .github/photo-atlas-fixed/part-00b.b64 \
            .github/photo-atlas-fixed/part-00c.b64 \
            .github/photo-atlas-fixed/part-00d.b64 \
            .github/photo-atlas-fixed/part-01.b64 \
            .github/photo-atlas-fixed/part-02.b64 \
            .github/photo-atlas-fixed/part-03.b64 \
            .github/photo-atlas-fixed/part-04.b64 \
            .github/photo-atlas-fixed/part-05.b64 \
            .github/photo-atlas-fixed/part-06.b64 > /tmp/photo-atlas.b64
          python - <<'PY'
          import base64
          from pathlib import Path
          encoded = Path("/tmp/photo-atlas.b64").read_text().strip()
          image = base64.b64decode(encoded, validate=True)
          if image[:4] != b"RIFF" or image[8:12] != b"WEBP":
              raise SystemExit("The presentation photo atlas is not a valid WebP file")
          Path("assets/photo-atlas.webp").write_bytes(image)
          print(f"Restored verified photo atlas: {len(image):,} bytes")
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site files
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4

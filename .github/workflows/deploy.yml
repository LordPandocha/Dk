name: Deploy site to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore presentation photos
        run: |
          cat \
            .github/photo-atlas.part1.b64 \
            .github/photo-atlas.part2a.b64 \
            .github/photo-atlas.part2b.b64 \
            .github/photo-atlas.part2c.b64 \
            .github/photo-atlas.part2d.b64 \
            .github/photo-atlas.part2e.b64 \
            .github/photo-atlas.part2f.b64 \
            .github/photo-atlas.part2g.b64 \
            .github/photo-atlas.part2h.b64 > /tmp/photo-atlas.b64
          base64 --decode /tmp/photo-atlas.b64 > assets/photo-atlas.webp
          test -s assets/photo-atlas.webp
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site files
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
